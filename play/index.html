<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>두사탈 1화 · 베타</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
  #c { width: 100vw; height: 100vh; display: block; background: #000; }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #F3EADB; background: #17130F; }
  #bar { width: min(420px, 70vw); height: 10px; border-radius: 5px; background: #2F261E; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #F2C94C; transition: width .2s; }
  #rot { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center; color: #F3EADB; background: #17130F; font-size: 18px; padding: 24px; }
  @media (orientation: portrait) and (max-width: 900px) { #rot { display: flex; } }
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="load"><div style="font-size:28px;font-weight:bold">두사탈</div><div>두더지 회사 탈출하기 · 1화 불러오는 중…</div><div id="bar"><div id="fill"></div></div></div>
<div id="rot">휴대폰을 가로로 돌려 주세요.</div>
<script src="Build/WebGL.loader.js?v=0.4.0"></script>
<script>
  createUnityInstance(document.querySelector('#c'), {
    dataUrl: 'Build/WebGL.data.unityweb?v=0.4.0',
    frameworkUrl: 'Build/WebGL.framework.js.unityweb?v=0.4.0',
    codeUrl: 'Build/WebGL.wasm.unityweb?v=0.4.0',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'Dusatal', productName: '두사탈', productVersion: '0.4.0',
    autoSyncPersistentDataPath: true,
    matchWebGLToCanvasSize: true,
  }, p => { document.querySelector('#fill').style.width = (p * 100) + '%'; })
  .then(() => { document.querySelector('#load').style.display = 'none'; })
  .catch(e => { document.querySelector('#load').innerHTML = '불러오지 못했습니다: ' + e; });
</script>
</body>
</html>
