<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>두사탈 1화 · 베타</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#17130F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="두사탈">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
  #c { width: 100vw; height: 100vh; display: block; background: #000; }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #F3EADB; background: #17130F; }
  #bar { width: min(420px, 70vw); height: 10px; border-radius: 5px; background: #2F261E; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #F2C94C; transition: width .2s; }
  #rot { display: none; position: fixed; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; color: #F3EADB; background: #17130F; font-size: 17px; padding: 24px; z-index: 10; }
  #rot svg { width: 72px; height: 72px; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  #go { border: 0; border-radius: 12px; background: #F2C94C; color: #17130F; font-size: 18px; font-weight: bold; padding: 14px 26px; }
  #inst { display: none; position: fixed; right: 10px; bottom: 52px; z-index: 5; border: 0; border-radius: 10px; background: #F2C94C; color: #17130F; font-size: 14px; font-weight: bold; padding: 8px 12px; }
  #fs { display: none; position: fixed; right: 10px; bottom: 10px; z-index: 5; border: 0; border-radius: 10px; background: rgba(23,19,15,.75); color: #F3EADB; font-size: 14px; padding: 8px 12px; }
  @media (orientation: portrait) and (max-width: 900px) { #rot { display: flex; } }
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="load"><img src="logo.png" alt="두사탈" style="width:min(520px,80vw)"><div>두더지 회사 탈출하기 · 1화 불러오는 중…</div><div id="bar"><div id="fill"></div></div></div>
<button id="fs">전체 화면</button>
<button id="inst">앱으로 설치</button>
<div id="rot"><svg viewBox="0 0 24 24" fill="none" stroke="#F3EADB" stroke-width="1.6"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18.5" x2="13" y2="18.5"/></svg><button id="go">가로 화면으로 하기</button><div id="rothint">휴대폰을 가로로 돌려도 됩니다.</div></div>
<script>
  var v = '0.8.30';
  // Installable: Chrome hands over an install prompt; the button shows only then (and not once installed).
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  (function () {
    var deferred = null, inst = document.getElementById('inst');
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; inst.style.display = 'block'; });
    inst.onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; inst.style.display = 'none'; }); };
    window.addEventListener('appinstalled', function () { inst.style.display = 'none'; });
  })();
  // In-app browsers (KakaoTalk, LINE) can't go full screen: open the page in the phone's own browser.
  (function () {
    var ua = navigator.userAgent;
    if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); return; }
    if (/ Line\//.test(ua) && !/openExternalBrowser=1/.test(location.search)) { location.href = location.href + (location.search ? '&' : '?') + 'openExternalBrowser=1'; }
  })();
  // Phone in landscape: the first tap on the game goes full screen (the address bar and the bottom bar take a third
  // of the height otherwise); after leaving full screen a small button brings it back.
  (function () {
    var phone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
    var de = document.documentElement, fs = document.getElementById('fs');
    if (!phone || !de.requestFullscreen) return;
    function full() {
      de.requestFullscreen({ navigationUI: 'hide' }).then(function () { if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape'); }).catch(function () {});
    }
    function show() { fs.style.display = document.fullscreenElement || window.innerHeight > window.innerWidth ? 'none' : 'block'; }
    fs.onclick = full;
    document.getElementById('c').addEventListener('pointerup', function first() {
      if (!document.fullscreenElement && window.innerWidth > window.innerHeight) full();
      this.removeEventListener('pointerup', first);
    });
    document.addEventListener('fullscreenchange', show); window.addEventListener('resize', show); show();
  })();
  // Portrait phone: one tap goes full screen and locks landscape (Android), so a phone with rotation lock on still
  // plays. Where the browser can't lock (iPhone Safari), say how to turn it instead.
  (function () {
    var go = document.getElementById('go'), hint = document.getElementById('rothint');
    var canLock = !!(document.documentElement.requestFullscreen && screen.orientation && screen.orientation.lock);
    if (!canLock) { go.style.display = 'none'; hint.textContent = '화면 회전 잠금을 풀고 휴대폰을 가로로 돌려 주세요.'; }
    go.onclick = function () {
      document.documentElement.requestFullscreen({ navigationUI: 'hide' })
        .then(function () { return screen.orientation.lock('landscape'); })
        .catch(function () { hint.textContent = '화면 회전 잠금을 풀고 휴대폰을 가로로 돌려 주세요.'; });
    };
  })();
  // Phones: ASTC textures if the GPU has no DXT, and at most 1.5 device pixels per CSS pixel (a 3x screen would
  // otherwise render four times the pixels for no visible gain in this art).
  var gl = document.createElement('canvas').getContext('webgl2');
  var astc = /[?&]astc=1/.test(location.search) || (!!(gl && gl.getExtension('WEBGL_compressed_texture_astc')) && !(gl && gl.getExtension('WEBGL_compressed_texture_s3tc')));   // ?astc=1 forces the phone build (testing)
  var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
  var dir = astc ? 'Build-astc/' : 'Build/';
  var s = document.createElement('script');
  s.src = dir + 'WebGL.loader.js?v=' + v;
  s.onload = function () {
    createUnityInstance(document.querySelector('#c'), {
      dataUrl: dir + 'WebGL.data.unityweb?v=' + v,
      frameworkUrl: dir + 'WebGL.framework.js.unityweb?v=' + v,
      codeUrl: dir + 'WebGL.wasm.unityweb?v=' + v,
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Dusatal', productName: '두사탈', productVersion: v,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2),
      autoSyncPersistentDataPath: false,   // the game syncs saves itself, in batches (WebStorage.jslib)
      matchWebGLToCanvasSize: true,
    }, function (p) { document.querySelector('#fill').style.width = (p * 100) + '%'; })
    .then(function () { document.querySelector('#load').style.display = 'none'; })
    .catch(function (e) { document.querySelector('#load').innerHTML = '불러오지 못했습니다: ' + e; });
  };
  document.body.appendChild(s);
</script>
</body>
</html>
